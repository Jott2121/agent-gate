name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with MCP SDK)
        run: pip install -e ".[dev]" pytest-cov
      - name: Run tests + coverage gate
        run: python -m pytest -q --cov=agent_gate --cov-report=term-missing --cov-fail-under=90

  coverage:
    # Produces the coverage badge + a per-PR coverage comment (self-contained,
    # no third-party service). Runs single-version; the gate above is the matrix.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" coverage
      - name: Measure coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Coverage badge + PR comment
        uses: py-cov-action/python-coverage-comment-action@745a5e59778fd7ca158c9b7d4979c998b08983ea # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  receipts:
    # Recompute the fail-closed README examples and confirm the 90% floor
    # was not lowered. Does not rewrite published numbers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" pytest-cov
      - name: Recompute receipts
        run: python scripts/check_receipts.py

  no-employer-data:
    # Scans every tracked file against the hashed terms in
    # .github/blocked-terms.sha256, plus the optional EMPLOYER_MARKERS secret
    # (regex alternation). The hash list alone catches the employer name when
    # the secret is unset; the job fails if the hash file is missing or empty.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Block employer / export-control terms
        env:
          EMPLOYER_MARKERS: ${{ secrets.EMPLOYER_MARKERS }}
        run: python3 scripts/scan_blocked_terms.py
      - name: Block committed build junk
        run: "! git ls-files | grep -E '(__pycache__/|\\.pyc$|^\\.coverage$)'"
